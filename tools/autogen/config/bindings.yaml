# Couchbase Node.js SDK - C++ binding generation config.
#
# Single source of truth for what the generator parses out of the C++ core and
# what it emits.  Adding a binding should mean editing this file, not the code.
#
# See tools/autogen/README.md for the full schema.

metadata:
  version: "1.0.0"
  description: "Programmatic generation of alignment between the C++ core and the Node.js N-API layer"

# ---------------------------------------------------------------------------
# C++ core checkout and its CPM dependency cache.  Both are relative to the
# repository root.
# ---------------------------------------------------------------------------
cxx_client:
  root: deps/couchbase-cxx-client
  cache: deps/couchbase-cxx-cache
  # Include paths contributed by CPM-vendored dependencies.  {cache} is the
  # path above; {hash} is the CPM hash directory, discovered at runtime.
  deps_include_paths:
    asio:
      - "-I{cache}/asio/{hash}/asio/asio/include"
    gsl:
      - "-I{cache}/gsl/{hash}/gsl/include"
    json:
      - "-I{cache}/json/{hash}/json/include"
      - "-I{cache}/json/{hash}/json/external/PEGTL/include"
    spdlog:
      - "-I{cache}/spdlog/{hash}/spdlog/include"

# ---------------------------------------------------------------------------
# Parsing
# ---------------------------------------------------------------------------
parser:
  # Headers handed to libclang.  A trailing "*" means "every .hxx in this
  # directory"; "<dir>/<prefix>*" means "every .hxx starting with <prefix>".
  # _json.hxx and _fmt.hxx files are always excluded.
  headers:
    - core/management/analytics_dataset.hxx
    - core/management/analytics_index.hxx
    - core/management/analytics_link_azure_blob_external.hxx
    - core/management/analytics_link_couchbase_remote.hxx
    - core/management/analytics_link_s3_external.hxx
    - core/management/bucket_settings.hxx
    - core/management/design_document.hxx
    - core/management/eventing_function.hxx
    - core/management/eventing_status.hxx
    - core/management/rbac.hxx
    - core/management/search_index.hxx
    - couchbase/management/query_index.hxx
    - couchbase/retry_reason.hxx
    - core/topology/collections_manifest.hxx
    - core/protocol/client_opcode.hxx
    - core/protocol/cmd_lookup_in.hxx
    - core/protocol/cmd_mutate_in.hxx
    - core/protocol/status.hxx
    - core/analytics_scan_consistency.hxx
    - core/design_document_namespace.hxx
    - core/diagnostics.hxx
    - core/document_id.hxx
    - core/json_string.hxx
    - couchbase/query_profile.hxx
    - couchbase/query_scan_consistency.hxx
    - core/search_highlight_style.hxx
    - core/search_scan_consistency.hxx
    - core/service_type.hxx
    - core/view_on_error.hxx
    - core/view_scan_consistency.hxx
    - core/view_sort_order.hxx
    - core/operations/*
    - core/operations/document_view.hxx
    - core/operations/management/*
    - couchbase/durability_level.hxx
    - couchbase/cas.hxx
    - couchbase/error_codes.hxx
    - couchbase/mutation_token.hxx
    - core/error_context/key_value_status_code.hxx
    - core/impl/subdoc/opcode.hxx
    - core/impl/subdoc/command.hxx
    - couchbase/store_semantics.hxx
    - couchbase/persist_to.hxx
    - couchbase/replicate_to.hxx
    - couchbase/read_preference.hxx
    - core/range_scan_options.hxx
    - core/range_scan_orchestrator_options.hxx
    - core/query_context.hxx
    - core/vector_query_combination.hxx
    - core/transactions/exceptions.hxx
    - core/transactions/transaction_get_multi_mode.hxx
    - core/transactions/transaction_get_multi_replicas_from_preferred_server_group_mode.hxx

  # Fully-qualified C++ types to generate bindings for.  A trailing "*" matches
  # any suffix, so "couchbase::core::operations::*" picks up every operation.
  types:
    - couchbase::core::management::analytics::dataset
    - couchbase::core::management::analytics::index
    - couchbase::core::management::analytics::azure_blob_external_link
    - couchbase::core::management::analytics::couchbase_link_encryption_level
    - couchbase::core::management::analytics::couchbase_link_encryption_settings
    - couchbase::core::management::analytics::couchbase_remote_link
    - couchbase::core::management::analytics::s3_external_link
    - couchbase::core::management::cluster::bucket_settings*
    - couchbase::core::management::cluster::bucket_type
    - couchbase::core::management::cluster::bucket_compression
    - couchbase::core::management::cluster::bucket_eviction_policy
    - couchbase::core::management::cluster::bucket_conflict_resolution
    - couchbase::core::management::cluster::bucket_storage_backend
    - couchbase::core::management::views::design_document*
    - couchbase::core::management::eventing::function*
    - couchbase::core::management::eventing::status
    - couchbase::core::management::rbac::role
    - couchbase::core::management::rbac::role_and_description
    - couchbase::core::management::rbac::origin
    - couchbase::core::management::rbac::role_and_origins
    - couchbase::core::management::rbac::user
    - couchbase::core::management::rbac::auth_domain
    - couchbase::core::management::rbac::user_and_metadata
    - couchbase::core::management::rbac::group
    - couchbase::core::management::search::index
    - couchbase::management::query_index
    - couchbase::retry_reason
    - couchbase::core::topology::collections_manifest*
    - couchbase::core::protocol::status
    - couchbase::core::protocol::subdoc_opcode
    - couchbase::core::protocol::lookup_in_request_body::lookup_in_specs
    - couchbase::core::protocol::mutate_in_request_body::mutate_in_specs
    - couchbase::core::protocol::mutate_in_request_body::store_semantics_type
    - couchbase::durability_level
    - couchbase::errc::common
    - couchbase::errc::key_value
    - couchbase::errc::query
    - couchbase::errc::analytics
    - couchbase::errc::search
    - couchbase::errc::view
    - couchbase::errc::management
    - couchbase::errc::field_level_encryption
    - couchbase::errc::network
    - couchbase::core::analytics_scan_consistency
    - couchbase::cas
    - couchbase::core::design_document_namespace
    - couchbase::core::diag::cluster_state
    - couchbase::core::diag::endpoint_state
    - couchbase::core::diag::endpoint_diag_info
    - couchbase::core::diag::diagnostics_result
    - couchbase::core::diag::ping_state
    - couchbase::core::diag::endpoint_ping_info
    - couchbase::core::diag::ping_result
    - couchbase::core::document_id
    - couchbase::core::json_string
    - couchbase::mutation_token
    - couchbase::query_profile
    - couchbase::query_scan_consistency
    - couchbase::core::search_highlight_style
    - couchbase::core::search_scan_consistency
    - couchbase::core::service_type
    - couchbase::core::view_on_error
    - couchbase::core::view_scan_consistency
    - couchbase::core::view_sort_order
    - couchbase::core::operations::*
    - couchbase::core::operations::management::*
    - couchbase::core::tracing::request_span
    - couchbase::core::key_value_status_code
    - couchbase::core::impl::subdoc::command
    - couchbase::core::impl::subdoc::opcode
    - couchbase::store_semantics
    - couchbase::persist_to
    - couchbase::replicate_to
    - couchbase::core::range_scan_create_options
    - couchbase::core::range_scan_continue_options
    - couchbase::core::range_scan_cancel_options
    - couchbase::core::range_scan_orchestrator_options
    - couchbase::core::mutation_state
    - couchbase::core::scan_term
    - couchbase::core::scan_sort
    - couchbase::core::range_scan
    - couchbase::core::prefix_scan
    - couchbase::core::sampling_scan
    - couchbase::core::range_snapshot_requirements
    - couchbase::core::range_scan_item_body
    - couchbase::core::range_scan_item
    - couchbase::core::range_scan_create_result
    - couchbase::core::range_scan_continue_result
    - couchbase::core::range_scan_cancel_result
    - couchbase::core::query_context
    - couchbase::core::vector_query_combination
    - couchbase::read_preference
    - couchbase::core::transactions::failure_type
    - couchbase::core::transactions::external_exception
    - couchbase::core::transactions::transaction_get_multi_mode
    - couchbase::core::transactions::transaction_get_multi_replicas_from_preferred_server_group_mode

  # Types matching `types` are still skipped when their name contains any of
  # these fragments.
  excluded_name_fragments:
    - is_compound_operation
    - replica_context

  # Class templates instantiated once per listed template argument.  The key is
  # the bare (unqualified) request name as it appears in the header.
  templated_requests:
    analytics_link_create_request:
      template_name: analytics_link_type
      templates:
        - couchbase::core::management::analytics::azure_blob_external_link
        - couchbase::core::management::analytics::couchbase_remote_link
        - couchbase::core::management::analytics::s3_external_link
    analytics_link_replace_request:
      template_name: analytics_link_type
      templates:
        - couchbase::core::management::analytics::azure_blob_external_link
        - couchbase::core::management::analytics::couchbase_remote_link
        - couchbase::core::management::analytics::s3_external_link

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
# A request carrying `parent_span` has that field rewritten to an optional
# string, and its matching `_response` gains a `cpp_core_span` field.
observability:
  # Responses that gain `cpp_core_span` even though no matching request
  # declares `parent_span` (templated requests, so the pairing by name fails).
  span_only_responses:
    - couchbase::core::operations::management::analytics_link_create_response
    - couchbase::core::operations::management::analytics_link_replace_response

# ---------------------------------------------------------------------------
# Rendering
# ---------------------------------------------------------------------------
renderer:
  # Structs dropped before anything else is derived from the parsed model.
  excluded_structs:
    # Currently broken in the C++ core; excluded until it is fixed.
    - couchbase::core::operations::mcbp_noop_request

  # Types whose marshalling is hand-written in src/jstocbpp_*.hpp.  They are
  # still parsed (fields of other structs refer to them) but no binding is
  # emitted for them.  Structs whose name ends in "::internal" are dropped too.
  custom_defined_types:
    - couchbase::core::json_string
    - couchbase::core::document_id
    - couchbase::cas
    - couchbase::mutation_token
    - couchbase::retry_strategy
    - couchbase::core::query_context
    - couchbase::core::wrapper_sdk_span
    - couchbase::node_id

  # Non-response types whose to_js still accepts a wrapper span.  Responses get
  # this by virtue of their name ending in "response".
  other_observable_types:
    - couchbase::core::range_scan_orchestrator_options

  # Fields never marshalled.  Trailing-underscore (private) fields are ignored
  # as well, except in the structs listed below.
  ignored_fields:
    - retries
    - ctx
    - row_callback
    - parent_span
    - retry_strategy
    - internal
    - revive_document
    - cpp_core_span
    - dispatched_to_node_id

  structs_with_allowed_private_fields:
    - couchbase::core::impl::subdoc::command
    - couchbase::core::range_scan

  # Fields emitted as optional on the TypeScript side even though the underlying
  # C++ type is not std::optional.
  optional_ts_fields:
    couchbase::core::impl::subdoc::command:
      - value_

  # A std::variant carries no discriminator once it reaches JS, so each variant listed here is
  # flattened into a "<field>_name" / "<field>_value" pair: "<field>_name" holds the tag naming
  # the alternative, "<field>_value" the alternative itself.  Hand-written lib/ code reads those
  # tags, so they are configured rather than derived - renaming the C++ struct must not silently
  # rewrite the JS contract.
  #
  # The alternatives themselves come from the C++ core, not from here; the config is cross-checked
  # against them, so an alternative added, removed or renamed in the core fails generation instead
  # of quietly changing what JS receives.  std::monostate takes no tag - it is what an absent
  # value marshals to, and its branch is simply not emitted.
  cpp_core_variants:
    - core_struct: couchbase::core::management::eventing::function_url_binding
      field: auth
      alternatives:
        - tag: function_url_no_auth
          core_struct: couchbase::core::management::eventing::function_url_no_auth
        - tag: function_url_auth_basic
          core_struct: couchbase::core::management::eventing::function_url_auth_basic
        - tag: function_url_auth_digest
          core_struct: couchbase::core::management::eventing::function_url_auth_digest
        - tag: function_url_auth_bearer
          core_struct: couchbase::core::management::eventing::function_url_auth_bearer

    - core_struct: couchbase::core::range_scan_create_options
      field: scan_type
      alternatives:
        - tag: range_scan
          core_struct: couchbase::core::range_scan
        - tag: prefix_scan
          core_struct: couchbase::core::prefix_scan
        - tag: sampling_scan
          core_struct: couchbase::core::sampling_scan

  # Counter delta / initial / content are uint64 in the core.  The shared
  # integral marshalling rounds them through a JS number (lossy above 2^53), so
  # these fields opt into exact bigint marshalling via cbpp_to_js_u64 /
  # js_to_cbpp_u64 (see src/jstocbpp_cpptypes.hpp).  The value is the TS type
  # emitted for the field: response values come back as `bigint`; request inputs
  # accept `number | bigint` so existing number callers are unaffected.
  bigint_fields:
    couchbase::core::operations::increment_response:
      content: bigint
    couchbase::core::operations::decrement_response:
      content: bigint
    couchbase::core::operations::increment_request:
      delta: number | bigint
      initial_value: number | bigint
    couchbase::core::operations::decrement_request:
      delta: number | bigint
      initial_value: number | bigint
    couchbase::core::operations::increment_request_with_legacy_durability:
      delta: number | bigint
      initial_value: number | bigint
    couchbase::core::operations::decrement_request_with_legacy_durability:
      delta: number | bigint
      initial_value: number | bigint

  # Each generated region.  Rendering replaces the text between the
  # "//#region <region>" and "//#endregion <region>" markers of an existing,
  # hand-maintained file - nothing is generated wholesale.
  outputs:
    - region: Autogenerated Bindings
      file: lib/binding.ts
      template: binding_ts.jinja2
    - region: Autogenerated Method Declarations
      file: src/connection.hpp
      template: connection_hpp.jinja2
    - region: Autogenerated Method Definitions
      file: src/connection_autogen.cpp
      template: connection_autogen_cpp.jinja2
    - region: Autogenerated Method Registration
      file: src/connection.cpp
      template: connection_cpp.jinja2
    - region: Autogenerated Constants
      file: src/constants.cpp
      template: constants_cpp.jinja2
    - region: Autogenerated Marshalling
      file: src/jstocbpp_autogen.hpp
      template: jstocbpp_autogen_hpp.jinja2

# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
# Checked after parsing and before anything is rendered.  A struct that reaches
# the renderer with no fields produces a binding that compiles, marshals
# nothing, and fails at runtime - so generation stops instead.
validation:
  # Structs that legitimately have no fields.  Both are empty in the C++ core
  # itself: one is the "no authentication" alternative of a variant, the other a
  # result type that carries only its success.
  allow_empty_fields:
    - couchbase::core::management::eventing::function_url_no_auth
    - couchbase::core::range_scan_cancel_result

  # Canaries for a partial parse.  A struct can lose most of its fields while
  # keeping a couple, which the empty check above would not notice; these are
  # the operations where that would do the most damage before being spotted.
  required_fields:
    couchbase::core::operations::query_request: [statement]
    couchbase::core::operations::analytics_request: [statement]
    couchbase::core::operations::search_request: [index_name, query]
    couchbase::core::operations::upsert_request: [id, value, flags]
    couchbase::core::operations::get_request: [id]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------
# The templates emit readable-but-unformatted code; these settle the final
# layout, and generation is not complete until they have run.  Files come from
# `renderer.outputs` and are matched by suffix, so a new generated region is
# formatted without touching this list.  Each command is passed its files as
# trailing arguments and run from the repository root, where it picks up
# .clang-format / .prettierrc.
format:
  formatters:
    ".hpp": [clang-format, -i]
    ".cpp": [clang-format, -i]
    ".ts": [npx, prettier, --write, --log-level, warn]
